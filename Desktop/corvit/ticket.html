<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSL Final Ticket Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="ticket.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 bg-white p-4 shadow rounded">
            <h2 class="text-center mb-4 text-success">PSL Final: Qalandars vs Kings</h2>
            
            <form id="bookingForm">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" placeholder="Enter name">
                </div>
                <div class="mb-3">
                    <label class="form-label">CNIC Number</label>
                    <input type="text" class="form-control" placeholder="12345-1234567-1">
                </div>
                <div class="mb-3">
                    <label class="form-label">Select Enclosure</label>
                    <select class="form-select">
                        <option>Imran Khan Enclosure</option>
                        <option>Fazal Mahmood Enclosure</option>
                        <option>Wasim Akram Enclosure</option>
                    </select>
                </div>
                
                <button type="button" class="btn btn-primary btn-qalandar w-100" data-bs-toggle="modal" data-bs-target="#confirmModal">
                    Book Ticket
                </button>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Ticket Summary</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Confirm your seat? Tickets are non-refundable!</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success">Confirm Booking</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
