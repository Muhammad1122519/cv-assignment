<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lahore Qalandars Playing 11</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .player-img {
            height: 300px;
            object-fit: cover; /* Sir's Hint: To prevent stretching */
        }
        .badge-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
        }
    </style>
</head>
<body class="bg-dark text-white">

    <div class="container py-5">
        <h1 class="text-center mb-5 text-danger">Lahore Qalandars Playing 11</h1>
        
        <div class="row g-4">
            <div class="col-lg-3 col-md-6 col-12">
                <div class="card bg-secondary border-0 h-100 position-relative">
                    <img src="Shaheen Shah Afridi.jpg" class="card-img-top player-img" alt="Player">
                    <span class="badge bg-danger badge-overlay">Captain</span>
                    <div class="card-body text-center">
                        <h5 class="card-title text-white">Shaheen Afridi</h5>
                        <p class="card-text text-light">Bowler</p>
                    </div>
                </div>
            </div>

            <div class="col-lg-3 col-md-6 col-12">
                <div class="card bg-secondary border-0 h-100 position-relative">
                    <img src="Rashid Khan World cup photo.jpg" class="card-img-top player-img" alt="Player">
                    <span class="badge bg-primary badge-overlay">Foreign Player</span>
                    <div class="card-body text-center">
                        <h5 class="card-title text-white">Rashid Khan</h5>
                        <p class="card-text text-light">All-Rounder</p>
                    </div>
                </div>
            </div>

            </div>
    </div>

</body>
</html>
