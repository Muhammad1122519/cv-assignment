<!DOCTYPE html>
<html>
<head>
<style>
  /* Sir wala code jo blue kar raha hai */
  #dangerous-id {
    color: blue;
    font-size: 20px;
  }

  /* AAPKA SOLUTION: ID aur Class ko mila kar likhein */
  #dangerous-id.make-it-red {
    color: red;
  }
</style>
</head>
<body>
  <button id="dangerous-id" class="make-it-red">
    I am stuck being Blue! Make me Red!
  </button>
</body>
</html>
